name: 'Setup Rust for Tauri'
description: 'Install Rust toolchain, system Tauri deps (Linux), and cache Cargo build output.'

inputs:
  target:
    description: 'Rust target triple (e.g. aarch64-apple-darwin).'
    required: true
  workspace:
    description: 'Cargo workspace path.'
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ inputs.target }}

    - name: Install Tauri system deps (Linux only)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libsoup-3.0-dev \
          patchelf

    - name: Cache Cargo build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: ${{ inputs.workspace }}
        key: ${{ inputs.target }}
        shared-key: tauri
