name: Build Desktop

# Basic single-package release: push a v* tag, get a signed + notarized macOS
# build on a GitHub Release, with the dmg mirrored to the R2 bucket.
# tauri-action creates the Release and uploads the updater manifest itself;
# the updater (when wired) polls the public GitHub Release directly, so there
# is no CDN manifest rewrite. Needs CLOUDFLARE_* and APPLE_* / TAURI_SIGNING_*
# secrets visible to this repo.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing v* tag to rebuild.'
        required: true

concurrency:
  group: build-desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (macOS)
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/setup-rust
        with:
          target: aarch64-apple-darwin

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: .
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Gilet ${{ inputs.tag || github.ref_name }}'
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # tauri.release.conf.json merges over the base config: it turns on
          # createUpdaterArtifacts, the macOS hardened-runtime signing block,
          # and the updater pubkey. Kept out of the base tauri.conf.json so a
          # plain local `tauri build` stays unsigned and skips notarization.
          args: --target aarch64-apple-darwin --config src-tauri/tauri.release.conf.json

      # tauri-action notarizes the .app but not the .dmg it wraps it in — that
      # dmg is a separate artifact Apple has never seen, and Gatekeeper blocks
      # it on download. Notarize + staple it in its own right.
      - name: Notarize and staple the DMG
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          DMG=$(find "target/aarch64-apple-darwin/release/bundle/dmg" -name '*.dmg' | head -1)
          if [ -z "${DMG}" ]; then
            echo "::error::No .dmg found to notarize."
            exit 1
          fi
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${DMG}"
          gh release upload "${RELEASE_TAG}" "${DMG}" --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Mirror the DMG to R2
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          DMG=$(find "target/aarch64-apple-darwin/release/bundle/dmg" -name '*.dmg' | head -1)
          bunx wrangler r2 object put "trove-cdn/releases/gilet/${RELEASE_TAG}/$(basename "$DMG")" \
            --file="$DMG" \
            --content-type="application/octet-stream" \
            --remote
