<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gilet — horizontal wordmark lockup

  Same mark as logo.svg (sleeveless gilet: armhole scoops, stand-up
  collar, centre-front zip, quilted baffle rows — see that file for the
  full description), set bare — no backing plate — beside the wordmark,
  for use directly on the app's own dark background (#0e1419). The
  garment's cutouts (zip, quilting) are true holes (fill-rule: evenodd),
  so this is real transparency, not a painted rectangle — it will still
  look correct on any background, not just the app's.

  Type: IBM Plex Sans Condensed, bold. The project already ships
  @fontsource/ibm-plex-sans-condensed, so it will be available inside
  the app; a system condensed sans is listed as a fallback for any
  other context. For pixel-perfect, install-independent output (icon
  packs, marketing exports, print) convert the <text> element to
  outlines in a vector tool (e.g. Illustrator/Inkscape/Figma "Object to
  Path") and drop the font-family entirely — see README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Gilet">
  <title>Gilet</title>

  <!-- mark, scaled and repositioned from its native 512x512 coordinates -->
  <g transform="translate(-28.402,-15.905) scale(0.520710)">
    <path
      fill-rule="evenodd"
      fill="#ff6a13"
      d="M116,140 L196,140 L196,92 L226,92 L256,150 L286,92 L316,92 L316,140 L396,140
         Q316,175 396,260 L396,430 L116,430 L116,260 Q196,175 116,140 Z
         M249,150 L263,150 L263,430 L249,430 Z
         M140,279 L240,279 L240,291 L140,291 Z
         M272,279 L372,279 L372,291 L272,291 Z
         M140,339 L240,339 L240,351 L140,351 Z
         M272,339 L372,339 L372,351 L272,351 Z
         M140,399 L240,399 L240,411 L140,411 Z
         M272,399 L372,399 L372,411 L272,411 Z"
    />
  </g>

  <!-- wordmark -->
  <text
    x="213.8"
    y="185"
    font-family="'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="700"
    font-size="178"
    letter-spacing="2"
    fill="#e8eff4"
  >Gilet</text>
</svg>
