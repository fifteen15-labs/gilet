<?xml version="1.0" encoding="UTF-8"?>
<!--
  Anorak — horizontal wordmark lockup

  Same mark as logo.svg (tapered coat body, hood with a true cut-out
  drawstring aperture, two ascending data columns seen through the
  opening), set bare — no backing panel — beside the wordmark, for use
  directly on the app's own dark background (#0e1419). The aperture is
  a genuine hole (fill-rule evenodd), so it is real transparency here,
  not a painted rectangle — it will still look correct on any
  background, not just the app's.

  Type: IBM Plex Sans Condensed, bold. The project already ships
  @fontsource/ibm-plex-sans-condensed, so it will be available inside
  the app; a system condensed sans is listed as a fallback for any
  other context. For pixel-perfect, install-independent output (icon
  packs, marketing exports, print) convert the <text> element to
  outlines in a vector tool (e.g. Illustrator/Inkscape/Figma "Object to
  Path") and drop the font-family entirely — see README.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="Anorak">
  <title>Anorak</title>

  <!-- mark, scaled and repositioned from its native 512x512 coordinates -->
  <g transform="translate(-77.8,-64.2) scale(0.719)">
    <path
      fill-rule="evenodd"
      fill="#ff6a13"
      d="M136,395 L166,217 Q166,187 196,187 L196,141 Q196,117 220,117 L292,117 Q316,117 316,141 L316,187 Q346,187 346,217 L376,395 Z
         M232,135 L280,135 Q292,135 292,147 L292,167 Q292,179 280,179 L232,179 Q220,179 220,167 L220,147 Q220,135 232,135 Z"
    />
    <rect x="239" y="153" width="12" height="18" fill="#3fbfa8"/>
    <rect x="261" y="141" width="12" height="30" fill="#3fbfa8"/>
  </g>

  <!-- wordmark -->
  <text
    x="220"
    y="120"
    dominant-baseline="central"
    font-family="'IBM Plex Sans Condensed', 'Arial Narrow', Arial, sans-serif"
    font-weight="700"
    font-size="150"
    letter-spacing="1"
    fill="#e8eff4"
  >Anorak</text>
</svg>
