<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gilet — primary mark (512x512)

  What it depicts: a sleeveless padded gilet (body-warmer), drawn flat and
  front-on, the way a kit supplier's product glyph would draw one. It is a
  literal garment icon, not an abstract badge.

  Three features carry the read, in order of importance:
    1. Armholes — a deep concave scoop cut into each side at the shoulder,
       flaring the shoulder out and cinching the torso in below it before
       the body squares off again at the hip. This is the single feature
       that says "sleeveless" and rules out a jacket or a t-shirt; it is
       drawn big and bold on purpose, because a small or fussy armhole is
       exactly the kind of detail that mushes away at icon size.
    2. A centre-front zip — a single vertical slit running from the base
       of the collar to the hem, splitting the garment into two panels.
    3. A stand-up collar — the top edge is drawn as two flat-topped points
       either side of a centre V, rather than a plain flat neckline. This
       is what reads as "coach on the touchline" rather than "generic
       safety vest."
  A fourth, lower-priority feature — three rows of horizontal quilted
  baffle seams — adds the padded/quilted texture real gilets have. It
  survives at 32px (checked; see below) so it stays in.

  Construction: one single flat-fill path (fill-rule: evenodd). The outer
  contour is the garment silhouette; the armhole scoops are notches cut
  directly into that outer contour (open to the edge, like a real
  armhole), not enclosed holes. The zip and the six quilting-seam segments
  are true interior cutouts, so on any background — including a flat
  single-colour re-fill — they show as genuine negative space rather than
  relying on a second colour to read. That is what makes the mark survive
  the monochrome-silhouette test: strip the orange and the shape alone
  (armholes, collar, zip slit, quilting) still reads as "gilet."

  Colour: Accent 1 hi-vis orange (#ff6a13) is the only colour on the
  garment — orange is the technical-wear colour, and a single confident
  colour on a dark ground reads more like a kit-supplier product mark
  than a multi-colour illustration. Accent 2 teal is deliberately not
  used here; it did not earn its place on an icon this simple.

  Checked at 512px, 32px and as a flat single-colour silhouette — the
  armhole scoops, collar points, centre zip and quilting rows all still
  read at 32px, and the shape holds with the colour stripped entirely.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Gilet">
  <title>Gilet</title>

  <!-- app background, full bleed -->
  <rect width="512" height="512" fill="#0e1419"/>

  <!-- the gilet: outer silhouette (shoulders, armhole scoops, stand-up
       collar points either side of a centre V, straight hem) plus true
       cutouts for the centre zip and three rows of quilting baffles -->
  <path
    fill-rule="evenodd"
    fill="#ff6a13"
    d="M116,140 L196,140 L196,92 L226,92 L256,150 L286,92 L316,92 L316,140 L396,140
       Q316,175 396,260 L396,430 L116,430 L116,260 Q196,175 116,140 Z
       M249,150 L263,150 L263,430 L249,430 Z
       M140,279 L240,279 L240,291 L140,291 Z
       M272,279 L372,279 L372,291 L272,291 Z
       M140,339 L240,339 L240,351 L140,351 Z
       M272,339 L372,339 L372,351 L272,351 Z
       M140,399 L240,399 L240,411 L140,411 Z
       M272,399 L372,399 L372,411 L272,411 Z"
  />
</svg>
