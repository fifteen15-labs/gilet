[package]
name = "gilet"
version = "0.16.0"
edition = "2021"
description = "Scouting tool for Football Manager saves"

[lib]
name = "gilet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
fm-save = { path = "../crates/fm-save" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }

[lints]
workspace = true
